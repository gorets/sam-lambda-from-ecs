AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM Template for creating Lambda function with Docker image from ECR

Parameters:
  UseExistingImage:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Use existing Docker image from ECR (true) or build a new one (false)

  EcrRepositoryName:
    Type: String
    Default: 'gorobets-test-ecr'
    Description: Name of the existing ECR repository (if UseExistingImage=true)

  ImageTag:
    Type: String
    Default: 'latest'
    Description: Tag of the Docker image (if UseExistingImage=true)

Conditions:
  BuildNewImage: !Equals [!Ref UseExistingImage, 'false']
  UseExistingEcrImage: !Equals [!Ref UseExistingImage, 'true']

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  # Lambda function with new Docker image build from scratch
  MyLambdaFunctionBuild:
    Type: AWS::Serverless::Function
    Condition: BuildNewImage
    Properties:
      FunctionName: MyLambdaFunction
      PackageType: Image
      ImageConfig:
        Command:
          - app.lambda_handler
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /hello
            Method: get
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.11-v1

  # Lambda function with existing Docker image from ECR
  MyLambdaFunctionExisting:
    Type: AWS::Serverless::Function
    Condition: UseExistingEcrImage
    Properties:
      FunctionName: MyLambdaFunction
      PackageType: Image
      ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}:${ImageTag}'
      ImageConfig:
        Command:
          - app.lambda_handler
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /hello-exists
            Method: get

Outputs:
  MyLambdaFunctionApi:
    Description: "API Gateway endpoint URL for Lambda function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/"
  MyLambdaFunctionArn:
    Description: "Lambda Function ARN"
    Value: !If
      - BuildNewImage
      - !GetAtt MyLambdaFunctionBuild.Arn
      - !GetAtt MyLambdaFunctionExisting.Arn
  MyLambdaFunctionIamRole:
    Description: "IAM Role for Lambda Function"
    Value: !If
      - BuildNewImage
      - !GetAtt MyLambdaFunctionBuildRole.Arn
      - !GetAtt MyLambdaFunctionExistingRole.Arn
